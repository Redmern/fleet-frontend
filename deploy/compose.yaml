# fleet marketing site on the VPS, behind the frontdoor Traefik
# (github.com/Redmern/frontdoor). Run via deploy/deploy.sh.
name: fleet-frontend

services:
  web:
    image: fleet-frontend:local
    build:
      context: ..
      args:
        SITE_URL: https://fleet-tui.dev/
    container_name: fleet-frontend-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # no `ports:` — Traefik reaches it over the proxy network
    networks: [proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.fleet-frontend.rule=Host(`fleet-tui.dev`) || Host(`www.fleet-tui.dev`)
      - traefik.http.routers.fleet-frontend.entrypoints=https
      # DNS is at Hostinger, so HTTP-01 instead of frontdoor's default Cloudflare DNS-01
      - traefik.http.routers.fleet-frontend.tls.certresolver=letsencrypt
      # www -> apex 301 is done by nginx (deploy/nginx.conf), not www-to-apex@file (308)
      - traefik.http.services.fleet-frontend.loadbalancer.server.port=8080

networks:
  proxy:
    external: true
