# Static file server for the exported site. Runs as uid 101 on :8080 with a
# read-only root fs (only /tmp is writable). TLS and HSTS are done by Traefik
# in front of it; the www -> apex 301 is done here (Traefik's redirectRegex
# answers 308).
server {
    listen 8080;
    server_name www.fleet-tui.dev;
    server_tokens off;
    return 301 https://fleet-tui.dev$request_uri;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json
               application/manifest+json application/x-asciicast image/x-icon;

    # nginx drops inherited add_header lines in any location that has its own,
    # so every location includes security-headers.inc.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }

    # Unhashed file names, so one hour, then revalidate with ETag.
    location ~* \.(css|js|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
    }
    location ~* \.cast$ {
        default_type application/x-asciicast;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        include /etc/nginx/security-headers.inc;
    }

    # Vendored libraries, fonts and images: long cache.
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.inc;
    }
    location ~* \.(png|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/security-headers.inc;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
